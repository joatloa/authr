
[package]
name = "authr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["joatloa"]
description = "A flexible authentication library for Rust applications, with OAuth 2.0, OpenID Connect, and database integrations."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joatloa/authr"
documentation = "https://docs.rs/authr"
keywords = ["authentication", "auth", "oauth", "actix", "diesel"]

[dependencies]
# HTTP framework
actix-web = { version = "4" }

# Database
diesel = { version = "2", default-features = false, features = ["r2d2", "chrono"] }
diesel_migrations = "2.4.0"

# Async support
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography and password hashing
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.11.1"
base64 = "0.22"
hkdf = "0.13.0"

# OAuth / OpenID Connect
oauth2 = "5"
openidconnect = "4"

# HTTP client for OAuth providers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
email_address = "0.2.9"
tracing = "0.1.44"

[features]
default = ["mysql"]

mysql = ["diesel/mysql"]
postgres = ["diesel/postgres"]
sqlite = ["diesel/sqlite"]
